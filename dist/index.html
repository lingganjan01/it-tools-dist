    <style>
      html { background: #f5f7fa; }
      html.dark { background: #101014; }

      #app-loading {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #f5f7fa;
        transition: opacity 0.25s ease;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
      }

      html.dark #app-loading { background: #101014; }

      .al-ring {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border: 3px solid rgba(24, 160, 88, 0.18);
        border-top-color: #18a058;
        animation: al-spin 0.75s linear infinite;
      }

      .al-title {
        font-size: 16px;
        font-weight: 700;
        color: #0f7a48;
        letter-spacing: 0.06em;
      }

      html.dark .al-title { color: #63e2b7; }

      .al-sub {
        font-size: 12px;
        color: #94a3b8;
        letter-spacing: 0.04em;
      }

      .al-bar {
        width: 132px;
        height: 3px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(24, 160, 88, 0.16);
      }

      .al-bar::after {
        content: "";
        display: block;
        width: 42%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #18a058, #63e2b7);
        animation: al-slide 1.15s ease-in-out infinite;
      }

      @keyframes al-spin { to { transform: rotate(360deg); } }

      @keyframes al-slide {
        0%   { transform: translateX(-110%); }
        100% { transform: translateX(340%); }
      }
    </style>
    <script type="module" crossorigin src="/app.1a957696.js"></script>
    <link rel="stylesheet" href="/style.14ef8a8c.css">
  </head>
  <body>
    <div id="app">
      <div id="app-loading">
        <div class="al-ring"></div>
        <div class="al-title">灵感工具箱</div>
        <div class="al-bar"></div>
        <div class="al-sub">正在加载工具…</div>
      </div>
    </div>
    
    <script>
      // 兜底：若 12 秒仍未挂载（例如极慢网络），给出提示但不阻塞
      setTimeout(function () {
        var el = document.getElementById('app-loading');
        if (el && el.parentNode) {
          var sub = el.querySelector('.al-sub');
          if (sub) sub.textContent = '仍在加载，请稍候…';
        }
      }, 12000);
    </script>
  </body>
